name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Container jobs default to /bin/sh (dash on Ubuntu), which doesn't support
# `set -o pipefail`.  Force bash everywhere; fedora:* and ubuntu:* base
# images all ship /bin/bash.
defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------
  # Read charliecloud_test/versions.conf and emit a single flat matrix
  # that downstream jobs consume.  Also decide whether this tag gets a
  # published or draft GitHub Release: vN.N.N -> published, else draft.
  # ------------------------------------------------------------------
  prelude:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_type: ${{ steps.release_type.outputs.release_type }}
    steps:
      - uses: actions/checkout@v5

      - name: Build matrix from versions.conf
        id: matrix
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source charliecloud_test/versions.conf
          include='[]'
          for v in ${FEDORA_VERSIONS:-}; do
            include=$(jq -c --arg v "$v" \
              '. + [{distro:"fedora",version:$v,image:"fedora:\($v)",tag_suffix:"Fedora-\($v)",ext:"rpm"}]' \
              <<<"$include")
          done
          for v in ${UBUNTU_VERSIONS:-}; do
            include=$(jq -c --arg v "$v" \
              '. + [{distro:"ubuntu",version:$v,image:"ubuntu:\($v)",tag_suffix:"Ubuntu-\($v)",ext:"deb"}]' \
              <<<"$include")
          done
          matrix=$(jq -c -n --argjson inc "$include" '{include:$inc}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "::notice::matrix=$matrix"

      - name: Determine release type from tag
        id: release_type
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_type=published" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=draft" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # One build job per matrix cell.  Compiles, runs ctest, produces a
  # distro-tagged kit, uploads it as an artifact.
  # ------------------------------------------------------------------
  build:
    needs: prelude
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prelude.outputs.matrix) }}
    steps:
      - name: Install toolchain (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          dnf -y install gcc-c++ git cmake make pkgconf \
                         fftw-devel openssl-devel rpm-build

      - name: Install toolchain (Ubuntu)
        if: matrix.distro == 'ubuntu'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git cmake pkg-config ca-certificates \
            libfftw3-dev libssl-dev

      - uses: actions/checkout@v5

      - name: Configure, build, test, package
        env:
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
          EXT: ${{ matrix.ext }}
          PKG_FLAG: ${{ matrix.distro == 'fedora' && '-DBUILD_RPM=ON' || '-DBUILD_DEB=ON' }}
          PKG_GEN:  ${{ matrix.distro == 'fedora' && 'RPM' || 'DEB' }}
        run: |
          set -euo pipefail
          mkdir build
          cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr "$PKG_FLAG" ../
          make -j"$(nproc)"
          ctest --output-on-failure
          make install
          cpack -G "$PKG_GEN"
          # Insert the distro tag before the extension.
          for f in *."$EXT"; do
            mv "$f" "${f%.$EXT}.${TAG_SUFFIX}.$EXT"
          done
          ls -l *."$EXT"

      - name: Upload kit artifact
        uses: actions/upload-artifact@v5
        with:
          name: kit-${{ matrix.distro }}-${{ matrix.version }}
          path: build/*.${{ matrix.ext }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Fresh container per matrix cell (no build toolchain).  Installs the
  # just-built kit and verifies every file the package claims to own
  # actually exists on disk.
  # ------------------------------------------------------------------
  test-install:
    needs: [prelude, build]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prelude.outputs.matrix) }}
    steps:
      - name: Prep (Fedora)
        if: matrix.distro == 'fedora'
        run: dnf -y install findutils

      - name: Prep (Ubuntu)
        if: matrix.distro == 'ubuntu'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates

      - uses: actions/download-artifact@v5
        with:
          name: kit-${{ matrix.distro }}-${{ matrix.version }}
          path: pkg

      - name: Install and verify (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          set -euo pipefail
          rpm_file=$(find pkg -maxdepth 1 -name '*.rpm' | head -1)
          test -n "$rpm_file"
          dnf -y install "$rpm_file"
          rpm -q sodalibs-devel
          missing=""
          for f in $(rpm -ql sodalibs-devel); do
            [ -e "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "MISSING FILES:" >&2
            printf '  %s\n' $missing >&2
            exit 1
          fi
          echo "all package files present"

      - name: Install and verify (Ubuntu)
        if: matrix.distro == 'ubuntu'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          echo "Contents of pkg/:"
          ls -laR pkg/
          deb_file=$(find pkg -type f -name '*.deb' | head -1)
          test -n "$deb_file"
          test -f "$deb_file"
          echo "Installing: $deb_file"
          apt-get update
          # Leading ./ tells apt "this is a file path, not a package name
          # with a release suffix" -- without it apt silently reinterprets
          # pkg/foo.deb as package 'pkg' from release 'foo.deb'.
          apt-get install -y --no-install-recommends "./$deb_file"
          dpkg -s sodalibs-devel >/dev/null
          missing=""
          for f in $(dpkg -L sodalibs-devel); do
            [ -e "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "MISSING FILES:" >&2
            printf '  %s\n' $missing >&2
            exit 1
          fi
          echo "all package files present"

  # ------------------------------------------------------------------
  # Collect every artifact, flatten to one directory, and create the
  # GitHub Release.  Draft unless the tag is strict vN.N.N.
  # ------------------------------------------------------------------
  release:
    needs: [prelude, build, test-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.rpm' -o -name '*.deb' \) \
               -exec cp -t dist/ {} +
          ls -l dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh normally reads the repo from .git/config in the workdir, but
          # this job doesn't check out the repo (it only consumes artifacts),
          # so point gh at the repo explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ needs.prelude.outputs.release_type }}
        run: |
          set -euo pipefail
          draft_flag=""
          if [ "$RELEASE_TYPE" = "draft" ]; then
            draft_flag="--draft"
          fi
          gh release create "$TAG" $draft_flag --title "$TAG" \
            --notes "SoDaLibs $TAG — automated release build." \
            dist/*
